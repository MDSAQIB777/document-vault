name: CI

on:
  pull_request:
    branches: [main]

jobs:
  sanity:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: document_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault -d document_vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vault:vault@localhost:5432/document_vault?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bunx prisma migrate deploy

      - run: bun run lint

      - run: bun run typecheck

      - run: bun test
