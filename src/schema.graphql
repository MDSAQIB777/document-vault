scalar DateTime

type Collection {
  id: ID!
  name: String!
  slug: String!
  createdAt: DateTime!
  documents: [Document!]!
}

type Document {
  id: ID!
  title: String!
  content: String!
  tags: [String!]!
  isArchived: Boolean!
  createdAt: DateTime!
  collectionId: ID!
  collection: Collection!
}

type DocumentEdge {
  cursor: String!
  node: Document!
}

type DocumentConnection {
  edges: [DocumentEdge!]!
  pageInfo: PageInfo!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Query {
  collections: [Collection!]!
  collection(id: ID!): Collection
  documents(
    collectionId: ID
    search: String
    isArchived: Boolean
    take: Int
    cursor: String
  ): DocumentConnection!
}

input CreateCollectionInput {
  name: String!
  slug: String!
}

input CreateDocumentInput {
  title: String!
  content: String!
  collectionId: ID!
  tags: [String!]
}

input UpdateDocumentInput {
  title: String
  content: String
  tags: [String!]
  isArchived: Boolean
}

type Mutation {
  createCollection(input: CreateCollectionInput!): Collection!
  createDocument(input: CreateDocumentInput!): Document!
  updateDocument(id: ID!, input: UpdateDocumentInput!): Document!
  deleteDocument(id: ID!): Boolean!
  moveDocument(id: ID!, collectionId: ID!): Document!
}
